{% extends 'base.html' %}{% block content %}<div class="container"><h1>Reports</h1><a href="{% url 'analytics:report_create' %}">Create report</a><table><tr><th>Name</th><th>Source</th><th>Status</th><th>Runs</th><th>Actions</th></tr>{% for report in reports %}<tr><td>{{ report.name }}</td><td>{{ report.get_source_display }}</td><td>{{ report.get_status_display }}</td><td>{{ report.run_count }}</td><td><a href="{% url 'analytics:report_run' report.pk %}">Run</a> <a href="{% url 'analytics:report_export' report.pk %}">CSV</a></td></tr>{% empty %}<tr><td colspan="5">No reports configured.</td></tr>{% endfor %}</table></div>{% endblock %}
