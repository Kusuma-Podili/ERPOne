{% extends 'base.html' %}{% block content %}<div class="container"><h1>Metric Catalog</h1><a href="{% url 'analytics:metric_create' %}">Create metric</a><table><tr><th>Name</th><th>Code</th><th>Source</th><th>Type</th></tr>{% for metric in metrics %}<tr><td>{{ metric.name }}</td><td>{{ metric.code }}</td><td>{{ metric.get_source_display }}</td><td>{{ metric.get_metric_type_display }}</td></tr>{% empty %}<tr><td colspan="4">No metrics configured.</td></tr>{% endfor %}</table></div>{% endblock %}
