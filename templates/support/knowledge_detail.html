{% extends 'base.html' %}{% block content %}<div class="container"><h1>{{ article.title }}</h1><p>{{ article.summary }}</p><div>{{ article.content|linebreaks }}</div><p>{{ article.view_count }} views · {{ article.helpful_ratio }}% helpful</p><form method="post" action="{% url 'support:knowledge_feedback' article.pk %}">{% csrf_token %}<button name="helpful" value="1">Helpful</button><button name="helpful" value="0">Not helpful</button></form></div>{% endblock %}
