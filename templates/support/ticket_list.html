{% extends 'base.html' %}{% block content %}<div class="container"><h1>Support Tickets</h1><form><input name="q" value="{{ request.GET.q }}" placeholder="Search tickets"><select name="status"><option value="">All statuses</option>{% for value,label in view.TicketStatus.choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select><button>Search</button></form><p><a href="{% url 'support:create' %}">New ticket</a></p><table><tr><th>Number</th><th>Subject</th><th>Status</th><th>Priority</th><th>Assignee</th></tr>{% for t in tickets %}<tr><td><a href="{% url 'support:detail' t.pk %}">{{ t.number }}</a></td><td>{{ t.subject }}</td><td>{{ t.get_status_display }}</td><td>{{ t.get_priority_display }}</td><td>{{ t.assignee.email|default:'Unassigned' }}</td></tr>{% endfor %}</table>{% endblock %}
