{% extends 'base.html' %}{% block content %}<div class="container"><h1>Knowledge Base</h1><form><input name="q" value="{{ request.GET.q }}" placeholder="Search articles"><button>Search</button></form>{% for a in articles %}<article><h2><a href="{% url 'support:knowledge_detail' a.pk %}">{{ a.title }}</a></h2><p>{{ a.summary }}</p><small>{{ a.view_count }} views · {{ a.helpful_ratio }}% helpful</small></article>{% empty %}<p>No published articles found.</p>{% endfor %}</div>{% endblock %}
