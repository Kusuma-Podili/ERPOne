{% extends 'payroll/base.html' %}{% block content %}<h2>Payroll Periods</h2><p><a href="{% url 'payroll:period_create' %}">New Period</a></p><table><tr><th>Code</th><th>Dates</th><th>Pay Date</th><th>Status</th></tr>{% for p in periods %}<tr><td><a href="{% url 'payroll:period_detail' p.pk %}">{{ p.code }}</a></td><td>{{ p.start_date }} - {{ p.end_date }}</td><td>{{ p.pay_date }}</td><td>{{ p.get_status_display }}</td></tr>{% endfor %}</table>{% endblock %}
