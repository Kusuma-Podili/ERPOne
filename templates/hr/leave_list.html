{% extends 'hr/base.html' %}{% block content %}<h2>Leave Requests</h2><p><a href="{% url 'hr:leave_create' %}">New Leave Request</a></p><table><tr><th>Employee</th><th>Dates</th><th>Days</th><th>Status</th></tr>{% for r in requests %}<tr><td>{{ r.employee.full_name }}</td><td>{{ r.start_date }} - {{ r.end_date }}</td><td>{{ r.days }}</td><td>{{ r.get_status_display }}</td></tr>{% empty %}<tr><td colspan="4">No requests</td></tr>{% endfor %}</table>{% endblock %}
