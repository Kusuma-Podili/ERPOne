{% extends 'hr/base.html' %}{% block content %}<h2>Attendance</h2><table><tr><th>Date</th><th>Employee</th><th>Status</th><th>Worked</th><th>Overtime</th></tr>{% for r in records %}<tr><td>{{ r.work_date }}</td><td>{{ r.employee.full_name }}</td><td>{{ r.get_status_display }}</td><td>{{ r.worked_minutes }} min</td><td>{{ r.overtime_minutes }} min</td></tr>{% empty %}<tr><td colspan="5">No records</td></tr>{% endfor %}</table>{% endblock %}
