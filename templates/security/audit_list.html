{% extends 'security/base.html' %}{% block content %}<h1>Audit Trail</h1><table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Object</th><th>Changed</th><th>Reason</th></tr>{% for e in entries %}<tr><td>{{ e.created_at }}</td><td>{{ e.actor }}</td><td>{{ e.action }}</td><td>{{ e.model_label }} / {{ e.object_id }}</td><td>{{ e.changed_fields }}</td><td>{{ e.reason }}</td></tr>{% endfor %}</table>{% endblock %}
