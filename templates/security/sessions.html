{% extends 'security/base.html' %}{% block content %}<h1>My Sessions</h1>{% for s in sessions %}<div class="card"><strong>{{ s.device_name|default:'Unknown device' }}</strong> — {{ s.status }}<br>{{ s.ip_address }} · last seen {{ s.last_seen_at }}<form method="post" style="margin-top:8px">{% csrf_token %}<input type="hidden" name="session_key" value="{{ s.session_key }}"><button>Revoke</button></form></div>{% empty %}<p>No tracked sessions.</p>{% endfor %}{% endblock %}
