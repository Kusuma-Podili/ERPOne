{% extends 'security/base.html' %}{% block content %}<h1>Security Events</h1><form><input name="event_type" placeholder="Event type" value="{{ event_type|default:'' }}"><select name="severity"><option value="">All severities</option><option value="INFO">Info</option><option value="LOW">Low</option><option value="MEDIUM">Medium</option><option value="HIGH">High</option><option value="CRITICAL">Critical</option></select><button>Filter</button></form><table><tr><th>When</th><th>User</th><th>Event</th><th>Severity</th><th>Outcome</th><th>IP</th></tr>{% for e in events %}<tr><td>{{ e.occurred_at }}</td><td>{{ e.user }}</td><td>{{ e.event_type }}</td><td>{{ e.severity }}</td><td>{{ e.outcome }}</td><td>{{ e.ip_address }}</td></tr>{% endfor %}</table>{% endblock %}
