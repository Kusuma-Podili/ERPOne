{% extends "base.html" %}{% block content %}<div class="container"><h1>Documents</h1><form><input name="q" value="{{ query }}" placeholder="Search documents"><button>Search</button></form><table><tr><th>Number</th><th>Title</th><th>Category</th><th>Status</th></tr>{% for d in documents %}<tr><td>{{ d.document_number }}</td><td><a href="{% url 'documents:detail' d.pk %}">{{ d.title }}</a></td><td>{{ d.category|default:'-' }}</td><td>{{ d.status }}</td></tr>{% endfor %}</table></div>{% endblock %}
