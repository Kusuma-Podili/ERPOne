{% extends "base.html" %}{% block content %}<div class="container"><h1>Notification Inbox</h1><p>{{ unread }} unread</p><a href="{% url 'notifications:mark_all_read' %}">Mark all read</a><table><tr><th>Title</th><th>Message</th><th>Priority</th><th>Time</th></tr>{% for n in notifications %}<tr class="{% if not n.is_read %}unread{% endif %}"><td>{{ n.title }}</td><td>{{ n.message }}</td><td>{{ n.priority }}</td><td>{{ n.created_at }}</td></tr>{% empty %}<tr><td colspan="4">No notifications.</td></tr>{% endfor %}</table></div>{% endblock %}
