{% extends "base.html" %}{% block content %}<main class="container"><h1>Active incidents</h1>{% for i in incidents %}<article><h2>{{ i.title }}</h2><p>{{ i.priority }} · {{ i.status }}</p><p>{{ i.summary }}</p><a href="{% url 'monitoring:incident_transition' i.id 'INVESTIGATING' %}">Investigate</a> <a href="{% url 'monitoring:incident_transition' i.id 'MITIGATED' %}">Mitigate</a> <a href="{% url 'monitoring:incident_transition' i.id 'RESOLVED' %}">Resolve</a></article>{% empty %}<p>No active incidents.</p>{% endfor %}</main>{% endblock %}
