{% extends "base.html" %}{% block content %}<main class="container"><h1>Active monitoring alerts</h1><table><tr><th>Title</th><th>Severity</th><th>Status</th><th>Occurrences</th><th>Actions</th></tr>{% for a in alerts %}<tr><td>{{ a.title }}</td><td>{{ a.severity }}</td><td>{{ a.status }}</td><td>{{ a.occurrence_count }}</td><td><a href="{% url 'monitoring:acknowledge_alert' a.id %}">Acknowledge</a> <a href="{% url 'monitoring:resolve_alert' a.id %}">Resolve</a></td></tr>{% empty %}<tr><td colspan="5">No active alerts.</td></tr>{% endfor %}</table></main>{% endblock %}
