{% extends 'base.html' %}{% block content %}<div class="container"><h1>AI & ML Models</h1><a href="{% url 'ai_engine:create' %}">Create model</a><table><tr><th>Name</th><th>Problem</th><th>Status</th><th>Source</th></tr>{% for model in models %}<tr><td><a href="{% url 'ai_engine:detail' model.id %}">{{ model.name }}</a></td><td>{{ model.get_problem_type_display }}</td><td>{{ model.get_status_display }}</td><td>{{ model.source_module }}</td></tr>{% empty %}<tr><td colspan="4">No models configured.</td></tr>{% endfor %}</table></div>{% endblock %}
